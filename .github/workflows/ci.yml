name: CI - Model Retraining & Docker Build

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: telco-churn-model

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install MLflow and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 numpy==1.26.4

      - name: Run MLflow Project (retrain model)
        working-directory: MLProject
        run: |
          mlflow run . --env-manager=local -P data_path=namadataset_preprocessing

      - name: Get latest run_id
        working-directory: MLProject
        id: get_run_id
        run: |
          RUN_ID=$(python -c "
          import mlflow
          runs = mlflow.search_runs(experiment_ids=['0'], order_by=['start_time DESC'])
          print(runs.iloc[0].run_id)
          ")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Latest run_id: $RUN_ID"

      - name: Upload artefak MLflow ke repository (GitHub)
        working-directory: MLProject
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlruns
          git diff --quiet --cached || git commit -m "chore: update MLflow run artifacts [automated]"
          git push

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image dengan mlflow build-docker
        working-directory: MLProject
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${{ steps.get_run_id.outputs.run_id }}/model" \
            --name "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest" \
            --env-manager local

      - name: Push Docker image ke Docker Hub
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest"

      - name: Upload artefak MLflow ke repository (GitHub)
        working-directory: MLProject
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlruns
          git diff --quiet --cached || git commit -m "chore: update MLflow run artifacts [automated]"
          git pull --rebase origin main
          git push
